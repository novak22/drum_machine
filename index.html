<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drum Machine</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🥁 DRUM MACHINE</h1>
      <div class="controls">
        <div class="bpm-control">
          <label>BPM</label>
          <input type="number" id="bpm-input" min="60" max="180" value="120">
          <input type="range"  id="bpm-slider" min="60" max="180" value="120">
        </div>
        <button id="play-btn">▶ PLAY</button>
        <button id="stop-btn" class="stop">■ STOP</button>
      </div>
    </div>

    <div class="pattern-bar">
      <div class="pattern-bank" id="pattern-bank"></div>
      <button id="new-pattern-btn" class="pattern-new-btn">+</button>
      <div class="pattern-divider"></div>
      <div class="swing-control">
        <label>Swing</label>
        <input type="range" id="swing-slider" min="0" max="50" step="1" value="0">
        <span id="swing-value">0%</span>
      </div>
    </div>
    <div class="song-chain-bar">
      <span class="song-label">SONG</span>
      <div class="song-chain" id="song-chain"></div>
      <button id="song-add-btn" class="secondary song-add-btn">+</button>
    </div>

    <div id="mobile-bar-tabs" class="mobile-bar-tabs"></div>

    <div class="sequencer-area">
      <div class="sequencer" id="sequencer"></div>
      <div class="kit-library" id="kit-library">
        <div class="library-header">
          <span>Kit Library</span>
          <button id="close-library-btn" class="close-btn" title="Close">&times;</button>
        </div>
        <div id="library-items" class="library-items"></div>
      </div>
    </div>

    <div id="page-dots" class="page-dots"></div>

    <div class="footer">
      <div class="footer-left">
        <button id="starters-btn" class="secondary">Starters</button>
        <button id="edit-kit-btn" class="secondary">Edit Kit</button>
        <button id="clear-btn" class="secondary">Clear</button>
        <button id="reset-btn" class="secondary danger">Reset All</button>
      </div>
      <div class="footer-right">
        <span id="save-indicator" class="save-indicator"></span>
        <div class="step-count-group">
          <button class="step-chip" data-steps="8">8</button>
          <button class="step-chip" data-steps="16">16</button>
          <button class="step-chip" data-steps="32">32</button>
        </div>
        <button id="import-btn" class="secondary">Import MIDI</button>
        <button id="export-btn" class="secondary">Export MIDI</button>
      </div>
    </div>

    <div class="mobile-transport">
      <button id="mob-starters-btn" class="mob-transport-btn mob-starters">Starters</button>
      <button id="mob-play-btn" class="mob-transport-btn">▶</button>
      <button id="mob-stop-btn" class="mob-transport-btn mob-stop">■</button>
    </div>

    <!-- Starters Modal -->
    <div id="presets-modal" class="modal">
      <div class="modal-content presets-modal-content">
        <div class="modal-header">
          <h2>Starter Patterns</h2>
          <button id="presets-modal-close" class="close-btn">&times;</button>
        </div>
        <div id="presets-tabs" class="preset-tabs"></div>
        <div class="modal-body">
          <div id="presets-grid" class="presets-grid"></div>
        </div>
      </div>
    </div>

    <!-- Sound Designer Modal -->
    <div id="sound-designer-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-title">Edit Sound</h2>
          <button id="modal-close" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="preset-row">
            <select id="preset-select"></select>
            <button id="load-preset-btn" class="secondary">Load</button>
            <button id="save-preset-btn" class="secondary">Save New</button>
          </div>
          <div id="param-controls" class="param-grid"></div>
          <div class="modal-actions">
            <button id="preview-sound-btn" class="secondary">Preview Sound</button>
          </div>
        </div>
        <div class="modal-footer">
          <button id="cancel-params-btn" class="secondary">Cancel</button>
          <button id="apply-params-btn">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MIDI libraries (global scope, used by src/midi/*.js) -->
  <script src="https://cdn.jsdelivr.net/npm/midi-writer-js@latest/build/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/midi-parser-js@latest/src/main.js"></script>

  <script type="module" src="main.js"></script>
</body>
</html>
